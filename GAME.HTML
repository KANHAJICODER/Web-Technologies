
<!DOCTYPE html>
<html>
<head>
<title>My Piano</title>
<style>
body{background:#171020;color:white;text-align:center;font-family:Arial}
h1{color:violet}
.piano{display:flex;position:relative;width:448px;margin:80px auto}
.white{width:64px;height:200px;background:white;border:1px solid black;color:black;font-size:20px;cursor:pointer}
.black{position:absolute;width:38px;height:120px;background:black;color:white;z-index:2;cursor:pointer}
</style>
</head>
<body>

<h1>🎹 My Piano</h1>
<h3>White: A S D F G H J</h3>
<h3>Black: W E T Y U</h3>

<div class="piano">
<button class="white" onclick="play(262)">A</button>
<button class="white" onclick="play(294)">S</button>
<button class="white" onclick="play(330)">D</button>
<button class="white" onclick="play(349)">F</button>
<button class="white" onclick="play(392)">G</button>
<button class="white" onclick="play(440)">H</button>
<button class="white" onclick="play(494)">J</button>

<button class="black" style="left:45px" onclick="play(277)">W</button>
<button class="black" style="left:109px" onclick="play(311)">E</button>
<button class="black" style="left:237px" onclick="play(370)">T</button>
<button class="black" style="left:301px" onclick="play(415)">Y</button>
<button class="black" style="left:365px" onclick="play(466)">U</button>
</div>

<script>
let audio = new AudioContext();

function play(freq){
 if(audio.state === "suspended") audio.resume();

 [1,2,3].forEach((n,i)=>{
  let note=audio.createOscillator();
  let vol=audio.createGain();

  note.type="triangle";
  note.frequency.value=freq*n;
  vol.gain.setValueAtTime([0.45,0.12,0.04][i],audio.currentTime);
  vol.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+1.5);

  note.connect(vol);
  vol.connect(audio.destination);
  note.start();
  note.stop(audio.currentTime+1.5);
 });
}

document.onkeydown=e=>{
 let keys={a:262,s:294,d:330,f:349,g:392,h:440,j:494,w:277,e:311,t:370,y:415,u:466};
 if(keys[e.key.toLowerCase()] && !e.repeat) play(keys[e.key.toLowerCase()]);
};
</script>

</body>
</html>
