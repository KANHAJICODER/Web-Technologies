
<!DOCTYPE html>
<html>
<head>
    <title>Arithmetic Operations</title>
</head>
<body>

<h1>Arithmetic Operations Using JavaScript</h1>

<script>
    var a = Number(prompt("Enter first number:"));
    var b = Number(prompt("Enter second number:"));

    document.write("<h2>Arithmetic Operations</h2>");

    document.write("First Number: " + a + "<br><br>");
    document.write("Second Number: " + b + "<br><br>");

    document.write("Addition: " + (a + b) + "<br><br>");
    document.write("Subtraction: " + (a - b) + "<br><br>");
    document.write("Multiplication: " + (a * b) + "<br><br>");
    document.write("Division: " + (a / b) + "<br><br>");
    document.write("Modulus: " + (a % b) + "<br><br>");
</script>

</body>
</html>
